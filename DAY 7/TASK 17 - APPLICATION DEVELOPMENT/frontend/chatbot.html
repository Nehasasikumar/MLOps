<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>
        Smart Factory Anomaly Detector
    </title>

    <link rel="stylesheet"
        href="css/style.css">

</head>

<body>

    <main class="main">

        <div class="chat-area"
            id="chatArea">

            <div class="welcome-text">

                <h1>
                    Smart Factory
                    Anomaly Detector
                </h1>

                <p>
                    Describe machine issues or enter
                    sensor values for AI analysis.
                </p>

            </div>

        </div>

        <div class="input-section">

            <div class="upload-options">

                <button>PDF</button>
                <button>VIDEO</button>
                <button>IMAGE</button>
                <button>AUDIO</button>

            </div>

            <div class="input-box">

                <input
                    type="text"
                    id="messageInput"
                    placeholder="Describe machine condition..."
                >

                <button class="send-btn">
                    ↑
                </button>

            </div>

        </div>

    </main>

    <script src="js/app.js"></script>

</body>

</html>
